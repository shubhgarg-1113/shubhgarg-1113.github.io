<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificates</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --secondary: #8b5cf6;
            --secondary-glow: rgba(139, 92, 246, 0.5);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            animation: fadeIn 1.2s ease-out;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 0.5rem 1.5rem;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateY(-2px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px var(--primary-glow);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 1rem 0;
            line-height: 1.3;
        }

        .card-issuer {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #cbd5e1;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        .card-date {
            font-size: 0.9rem;
            color: #64748b;
            margin-left: auto;
        }

        .card-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
            margin-top: auto;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: background 0.2s ease;
        }

        .card:hover .skill-tag {
            background: rgba(255, 255, 255, 0.15);
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            margin-top: auto;
        }

        .card-link:hover {
            color: #60a5fa;
        }

        .card-link svg {
            width: 1.2rem;
            height: 1.2rem;
            transition: transform 0.3s ease;
        }

        .card-link:hover svg {
            transform: translateX(4px) translateY(-4px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

    </style>
</head>
<body>

    <header>
        <h1>Certifications</h1>
        <p class="subtitle">My professional achievements and continuous learning journey</p>
    </header>

    <div class="filter-container" id="filter-container">
        <!-- Filters will be generated dynamically -->
    </div>

    <div class="grid" id="certificates-grid">
        <!-- Certificates will be generated here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('certificates-grid');
            const filterContainer = document.getElementById('filter-container');
            let allCertificates = [];
            let categories = new Set(['All']);

            // Fetch certificates
            try {
                const response = await fetch('certificates.json');
                if (!response.ok) throw new Error('Failed to load certificates');
                const data = await response.json();
                allCertificates = data.certificates;
                
                // Extract categories
                allCertificates.forEach(cert => {
                    if (cert.category) categories.add(cert.category);
                });

                renderFilters();
                renderCertificates(allCertificates);

            } catch (error) {
                console.error('Error fetching certificates:', error);
                grid.innerHTML = `<p style="text-align: center; color: #ef4444; width: 100%;">Failed to load certificates. Make sure you are running this on a local server or GitHub pages.</p>`;
            }

            function renderFilters() {
                filterContainer.innerHTML = '';
                categories.forEach(category => {
                    const btn = document.createElement('button');
                    btn.className = `filter-btn ${category === 'All' ? 'active' : ''}`;
                    btn.textContent = category;
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        if (category === 'All') {
                            renderCertificates(allCertificates);
                        } else {
                            const filtered = allCertificates.filter(cert => cert.category === category);
                            renderCertificates(filtered);
                        }
                    });
                    filterContainer.appendChild(btn);
                });
            }

            function renderCertificates(certs) {
                grid.innerHTML = '';
                certs.forEach((cert, index) => {
                    const delay = index * 0.1;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.animationDelay = `${delay}s`;

                    const skillsHtml = cert.skills && cert.skills.length > 0 
                        ? `<div class="card-skills">${cert.skills.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}</div>`
                        : '';

                    const linkHtml = cert.link 
                        ? `<a href="${cert.link}" target="_blank" class="card-link">
                            View Credential
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                           </a>`
                        : '';

                    card.innerHTML = `
                        <div class="card-category">${cert.category || 'Certification'}</div>
                        <h3 class="card-title">${cert.name}</h3>
                        <div class="card-issuer">
                            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                            ${cert.issuer}
                            <span class="card-date">${cert.date || ''}</span>
                        </div>
                        ${skillsHtml}
                        ${linkHtml}
                    `;
                    grid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
